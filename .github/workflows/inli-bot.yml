name: inli-bot

on:
  schedule:
    # Toutes les 30 minutes (heure UTC). GitHub peut retarder de quelques minutes.
    # Dépôt public : tu peux passer à "*/10 * * * *" sans limite de minutes.
    - cron: "*/30 * * * *"
  workflow_dispatch: {}   # bouton "Run workflow" pour lancer à la main

permissions:
  contents: write         # pour enregistrer seen.json (annonces déjà vues)

concurrency:
  group: inli-bot
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Vérifier les annonces
        run: python inli_bot.py
        env:
          INLI_SEARCH_URLS: ${{ vars.INLI_SEARCH_URLS }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}

      - name: Enregistrer les annonces vues
        if: always()
        run: |
          git config user.name "inli-bot"
          git config user.email "inli-bot@users.noreply.github.com"
          [ -f seen.json ] || exit 0
          git add seen.json
          git diff --cached --quiet || (git commit -m "inli-bot : mise à jour des annonces vues" && git push)
